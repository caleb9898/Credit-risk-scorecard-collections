[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrisk"
version = "0.1.0"
description = "Retail credit-risk workflow: PD scorecard, expected loss, interpretability, stability and collections strategy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "optbinning>=0.19",
  "lightgbm>=4.0",
  "shap>=0.44",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.6",
  "nbconvert>=7.0",
  "nbformat>=5.9",
  "ipykernel>=6.29",
]
app = ["streamlit>=1.32"]
spark = ["pyspark>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "spark: tests that need a local Spark session (run with: pytest -m spark)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501"]
